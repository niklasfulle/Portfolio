sonar.projectKey=Portfolio
sonar.projectName=Portfolio
sonar.sourceEncoding=UTF-8

sonar.sources=src,prisma
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=**/node_modules/**,**/.next/**,**/.scannerwork/**,**/.sonar/**,**/.git/**,**/coverage/**,**/build/**,**/out/**,**/*.config.*
sonar.coverage.exclusions=**/*.d.ts,src/app/**,src/components/**,src/context/**,src/styles/**,src/proxy.ts,src/lib/db/prisma.ts,src/lib/types.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true

# Tailwind CSS 4 directives are valid but not recognized by Sonar's CSS analyzer.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e1.resourceKey=src/styles/globals.css
